<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h1>Welcome to Angular!</h1>
      <h2>{{ title }}</h2>
      <!--  this is called interpolation -->
    </div>
    <div>
      <button [disabled]="off">Click</button>
      <!-- property binding -->
      <!-- here off is a variable declare it as true in app.component.ts -->
    </div>
    <div>
      <button (click)="showSome()">Click Me</button>
      <div *ngIf="showText">
        <h2>Button Click by someone</h2>
      </div>
    </div>
    <div>
      <!-- two way binding -->
      <input type="text" [(ngModel)]="title2" />
      <h2>{{ title2 }}</h2>
    </div>
  </body>
</html>
