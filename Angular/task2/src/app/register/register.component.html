<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="username">Username :</label>
    <input type="text" id="username" formControlName="username" required />
    <div
      *ngIf="
        registerForm.get('username')?.invalid &&
        registerForm.get('username')?.touched
      "
      style="color: red; font-size: 12px"
    >
      <span *ngIf="registerForm.get('username')?.errors?.['required']"
        >Username is required</span
      >
      <span *ngIf="registerForm.get('username')?.errors?.['minlength']"
        >Username must be at least 3 characters</span
      >
    </div>
  </div>

  <div>
    <label for="email">Email :</label>
    <input type="email" id="email" formControlName="email" required />
    <div
      *ngIf="
        registerForm.get('email')?.invalid && registerForm.get('email')?.touched
      "
      style="color: red; font-size: 12px"
    >
      <span *ngIf="registerForm.get('email')?.errors?.['required']"
        >Email is required</span
      >
      <span *ngIf="registerForm.get('email')?.errors?.['pattern']"
        >Please enter a valid email address</span
      >
    </div>
  </div>

  <div>
    <label for="password">Password :</label>
    <input type="password" id="password" formControlName="password" required />
    <div
      *ngIf="
        registerForm.get('password')?.invalid &&
        registerForm.get('password')?.touched
      "
      style="color: red; font-size: 12px"
    >
      <span *ngIf="registerForm.get('password')?.errors?.['required']"
        >Password is required</span
      >
      <span *ngIf="registerForm.get('password')?.errors?.['minlength']"
        >Password must be at least 8 characters</span
      >
    </div>
  </div>

  <div>
    <label for="confirmPassword">Confirm Password :</label>
    <input
      type="password"
      id="confirmPassword"
      formControlName="confirmPassword"
      required
    />
    <div
      *ngIf="
        registerForm.get('confirmPassword')?.invalid &&
        registerForm.get('confirmPassword')?.touched
      "
      style="color: red; font-size: 12px"
    >
      <span *ngIf="registerForm.get('confirmPassword')?.errors?.['required']"
        >Confirm Password is required</span
      >
    </div>
    <div
      *ngIf="registerForm.errors?.['mismatch'] && registerForm.touched"
      style="color: red; font-size: 12px"
    >
      Passwords do not match
    </div>
  </div>

  <div>
    <label for="phone">Phone Number :</label>
    <input type="tel" id="phone" formControlName="phone" required />
    <div
      *ngIf="
        registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched
      "
      style="color: red; font-size: 12px"
    >
      <span *ngIf="registerForm.get('phone')?.errors?.['required']"
        >Phone Number is required</span
      >
      <span *ngIf="registerForm.get('phone')?.errors?.['pattern']"
        >Phone Number must be 10 digits</span
      >
    </div>
  </div>

  <button type="submit" [disabled]="registerForm.invalid">Submit</button>
</form>
