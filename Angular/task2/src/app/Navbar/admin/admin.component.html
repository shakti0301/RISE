<br />

<div class="row">
  <div class="col-12">
    <div class="btn-group" role="group" aria-label="Basic example">
      <button
        type="button"
        class="btn btn-primary"
        (click)="changeTab('dashboard')"
        [disabled]="currentTab == 'dashboard'"
      >
        Dashboard
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="changeTab('settings')"
        [disabled]="currentTab == 'settings'"
      >
        Settings
      </button>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-12" *ngIf="currentTab == 'dashboard'">
    <app-dashboard></app-dashboard>
  </div>
  <div class="col-12" *ngIf="currentTab == 'settings'">
    <app-setting></app-setting>
  </div>
</div>
